name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # concurrency=1: parallel test-suite loading has been observed to
        # silently drop suites (exit code 0, "All tests passed", but with
        # fewer suites loaded than exist in test/) on some runners.
        run: flutter test --concurrency=1
